      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"

  <script>
    "use strict";
    // Код писать здесь
    console.log("It works!");

    let inputName = document.querySelector('.add-form-name')
    let inputText = document.querySelector('.add-form-text')
    let formBtn = document.querySelector('.add-form-button')
    let commentsList = document.querySelector('.comments')

    // 1. Обработка добавления комментария
    formBtn.addEventListener('click', function (event) {
      event.preventDefault()
      if (inputName.value.trim() === "" || inputText.value.trim() === "") {
        alert("Заполните все поля!")
        return
      }
      // Текущая дата и время
      const now = new Date()
      const formattedDate = now.toLocaleString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      }).replace(',', '')

      // HTML-шаблон
      let newCommentHtml = `
        <li class="comment">
            <div class="comment-header">
                <div>${inputName.value}</div>
                <div>${formattedDate}</div>
            </div>
            <div class="comment-body">
                <div class="comment-text">${inputText.value}</div>
            </div>
            <div class="comment-footer">
            <div class="comment-del">Удалить</div>
                <div class="likes">
                    <span class="likes-counter">0</span>
                    <button class="like-button"></button>
                </div>
            </div>
        </li>
    `;
      // Добавляем этот блок в конец списка комментариев
      commentsList.insertAdjacentHTML('beforeend', newCommentHtml)

      inputName.value = ""
      inputText.value = ""

        const lastComment = commentsList.lastElementChild
        const deleteBtn = lastComment.querySelector('.comment-del')
        deleteBtn.addEventListener('click', () => {
            lastComment.remove()
        })

    })
    // обработка лайков
    document.addEventListener('click', function(event) {
      const likeButton = event.target.closest('.like-button')
      if (!likeButton) return
      // Находим родительский контейнер .likes, чтобы внутри него найти счетчик
      const likesContainer = likeButton.closest('.likes')
      const countElement = likesContainer.querySelector('.likes-counter')
      if (!countElement) return
      // Получаем текущее количество лайков и переводим текст в число
      let currentCount = parseInt(countElement.textContent, 10) || 0

      likeButton.classList.toggle('-active-like')

      if (likeButton.classList.contains('-active-like')) {
        currentCount++
      } else {
        currentCount--
      }

      countElement.textContent = currentCount
    })


  </script>
</html>
